<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>译灵 · 管理后台</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --panel: #ffffff;
      --border: #e3e8f0;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --danger: #dc2626;
      --ok: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }
    .login-card { max-width: 380px; margin: 12vh auto 0; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 14px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      border: 0;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button.ghost { background: #eef2f7; color: var(--text); }
    button.danger { background: #fdeaea; color: var(--danger); }
    button.ok { background: #e7f6ec; color: var(--ok); }
    button:disabled { opacity: .5; cursor: default; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    tr:last-child td { border-bottom: 0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .badge.ok { background: #e7f6ec; color: var(--ok); }
    .badge.banned { background: #fdeaea; color: var(--danger); }
    .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .toolbar { display: flex; gap: 8px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .error { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loginView" class="panel login-card hidden">
      <h1>译灵管理后台</h1>
      <p class="muted">输入管理令牌以继续</p>
      <label for="token">管理令牌</label>
      <input id="token" type="password" autocomplete="off" placeholder="ADMIN_TOKEN">
      <div class="error" id="loginError"></div>
      <button id="loginBtn" style="width:100%">登录</button>
    </div>

    <div id="panelView" class="hidden">
      <header>
        <div>
          <h1>译灵管理后台</h1>
          <span class="muted" id="stat"></span>
        </div>
        <div class="toolbar">
          <button class="ghost" id="refreshBtn">刷新</button>
          <button class="ghost" id="logoutBtn">退出</button>
        </div>
      </header>
      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>昵称</th>
              <th>邮箱 / 账号</th>
              <th>注册时间</th>
              <th>状态</th>
              <th style="text-align:right">操作</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty hidden">暂无账号</div>
      </div>
    </div>
  </div>

  <script>
    async function api(path, options = {}) {
      const res = await fetch(path, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.detail || "请求失败");
      return data;
    }

    function fmtTime(ts) {
      if (!ts) return "-";
      return new Date(ts * 1000).toLocaleString("zh-CN", { hour12: false });
    }

    function showLogin() {
      document.getElementById("loginView").classList.remove("hidden");
      document.getElementById("panelView").classList.add("hidden");
    }

    function showPanel() {
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("panelView").classList.remove("hidden");
    }

    function render(users) {
      const rows = document.getElementById("rows");
      const empty = document.getElementById("empty");
      document.getElementById("stat").textContent = `共 ${users.length} 个账号`;
      rows.innerHTML = "";
      empty.classList.toggle("hidden", users.length > 0);

      for (const u of users) {
        const tr = document.createElement("tr");
        const banned = !!u.banned;
        tr.innerHTML = `
          <td>${u.id}</td>
          <td>${escapeHtml(u.name || "")}</td>
          <td>${escapeHtml(u.email || "")}</td>
          <td>${fmtTime(u.created_at)}</td>
          <td><span class="badge ${banned ? "banned" : "ok"}">${banned ? "已封禁" : "正常"}</span></td>
          <td>
            <div class="actions">
              <button class="${banned ? "ok" : "ghost"}" data-act="${banned ? "unban" : "ban"}" data-id="${u.id}">${banned ? "解封" : "封禁"}</button>
              <button class="danger" data-act="delete" data-id="${u.id}">删除</button>
            </div>
          </td>`;
        rows.appendChild(tr);
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    async function checkAuth() {
      try {
        const data = await api("/admin/users");
        render(data.users || []);
        showPanel();
      } catch {
        showLogin();
      }
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const token = document.getElementById("token").value.trim();
      const errEl = document.getElementById("loginError");
      errEl.textContent = "";
      if (!token) { errEl.textContent = "请输入令牌"; return; }
      try {
        await api("/admin/login", { method: "POST", body: JSON.stringify({ token }) });
        document.getElementById("token").value = "";
        await checkAuth();
      } catch (e) {
        errEl.textContent = e.message;
      }
    });

    document.getElementById("token").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await api("/admin/logout", { method: "POST" }).catch(() => {});
      showLogin();
    });

    document.getElementById("refreshBtn").addEventListener("click", checkAuth);

    document.getElementById("rows").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      if (act === "delete") {
        if (!confirm(`确定删除账号 #${id} 吗？该操作不可恢复。`)) return;
        await api(`/admin/users/${id}`, { method: "DELETE" });
      } else {
        await api(`/admin/users/${id}/${act}`, { method: "POST" });
      }
      checkAuth();
    });

    checkAuth();
  </script>
</body>
</html>
