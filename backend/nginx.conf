server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /backend {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    location /translate {
        proxy_pass http://api:8000;
    }

    location /lookup {
        proxy_pass http://api:8000;
    }

    location /chat {
        proxy_pass http://api:8000;
    }

    location /docs {
        proxy_pass http://api:8000;
    }

    location /openapi.json {
        proxy_pass http://api:8000;
    }
}
